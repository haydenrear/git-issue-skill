# git-issue — skill-manager unit manifest.
#
# Transitive dependencies are HARD skill_references so that installing this
# skill pulls in the three skills the issue workflow drives. Coordinates are
# git repo roots (github:owner/repo), NOT installed skill names — the resolver
# clones the repo and detects the unit from its root marker files. Note the
# repo name often differs from the [skill].name it installs:
#
#   github:haydenrear/test_graph_skill  -> skill "test-graph"
#   github:haydenrear/tla-spec-dev      -> skill "spec-double-compiler" (installs the tla-spec-dev CLI)
#   github:haydenrear/deploy-cdc        -> skill "deploy-helm"
#   github:haydenrear/git-integration-skill -> skill "git-integration-repo"
#
# git-integration-repo is a HARD reference and NOT a skill-import, deliberately.
# What this skill needs from it is one FILE that has to exist on disk —
# scripts/wt, the worktree front door every issue body now names by resolved
# path ($SKILL_MANAGER_HOME/skills/git-integration-repo/scripts/wt). A reference
# guarantees the file; an import would additionally drag integration-repo
# semantics — onboarding, propagation, fan-out — into the context of every
# plain-repo issue that will never use them. Install dependency, no context cost:
# that is the whole reason the two mechanisms are separate. See git-issue#4.
skill_references = [
  "github:haydenrear/test_graph_skill",
  "github:haydenrear/tla-spec-dev",
  "github:haydenrear/deploy-cdc",
  "github:haydenrear/git-integration-skill",
]

# The GitHub CLI, installed via Homebrew. This is the default issue-tracker
# adapter (see references/github-gh.md). Other trackers are supported by
# swapping the adapter; gh is the only one wired as a hard CLI dependency.
[[cli_dependencies]]
spec = "brew:gh"
on_path = "gh"

[skill]
name = "git-issue"
version = "0.3.0"
description = "Create discovery-first tracker work orders with references, worktree/branch instructions, optional TLA+ close-out, and bounded assignments for one ticket in an existing epic shared workflow."
